services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-smartcheckin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smartcheckin}
      - POSTGRES_DB=${POSTGRES_DB:-smartcheckin}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # smtp server
      - "8025:8025" # web ui
    restart: always

volumes:
  postgres-data:
