services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-smartcheckin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smartcheckin}
      - POSTGRES_DB=${POSTGRES_DB:-smartcheckin}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"

volumes:
  postgres-data:
