# PostgreSQL settings
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcheckin
spring.datasource.username=${POSTGRES_USER:checkin_user}
spring.datasource.password=${POSTGRES_PASSWORD:checkin_secret_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Configuración de límites para la subida de ficheros (Multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Cloudflare Turnstile
app.captcha.site-key=${REACT_APP_CAPTCHA_SITE_KEY:${CAPTCHA_SITE_KEY:1x00000000000000000000AA}}
app.captcha.secret=${CAPTCHA_SECRET:1x0000000000000000000000000000000AA}