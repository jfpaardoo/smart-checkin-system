# PostgreSQL settings
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcheckin
spring.datasource.username=${POSTGRES_USER:checkin_user}
spring.datasource.password=${POSTGRES_PASSWORD:checkin_secret_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true

# Desactivar JMX en producción
spring.jmx.enabled=false

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# Init DB
spring.sql.init.mode=always
spring.sql.init.platform=postgres

# Configuración de límites para la subida de ficheros (Multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Cloudflare Turnstile
app.captcha.site-key=${REACT_APP_CAPTCHA_SITE_KEY:${CAPTCHA_SITE_KEY:1x00000000000000000000AA}}
app.captcha.secret=${CAPTCHA_SECRET:1x0000000000000000000000000000000AA}