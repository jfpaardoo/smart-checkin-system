# Importación de secretos (archivo local ignorado por Git)
spring.config.import=optional:file:.env[.properties]

maven.basedir=@project.basedir@
# database init, supports mysql too
#spring.datasource.schema=classpath*:db/${database}/schema.sql
spring.mvc.pathpattern.matching-strategy=ant_path_matcher
spring.h2.console.enabled=true
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}
# Web
spring.thymeleaf.mode=HTML
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true


# Internationalization
spring.messages.basename=messages/messages

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Actuator / Management
#management.endpoints.web.base-path=/manage
#management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.resources.cache.cachecontrol.max-age=12h

# App Properties
spring.application.name=ba-distribution-academy
badistributionacademy.app.jwtSecret=${JWT_SECRET}
badistributionacademy.app.jwtExpirationMs=86400000 
badistributionacademy.app.totpSecret=${TOTP_SECRET}
smartcheckin.app.jwtSecret=${badistributionacademy.app.jwtSecret}
smartcheckin.app.jwtExpirationMs=${badistributionacademy.app.jwtExpirationMs}
smartcheckin.app.totpSecret=${badistributionacademy.app.totpSecret}
app.cors.allowed-origins=http://localhost:3000,https://miempresa.com

# API Properties
api.version=1.0-SNAPSHOT
tos.uri=terms-of-service
api.server.url=I don't know
api.description=The API is used to ...
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Email Properties (Gmail SMTP Configuration)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Default "From" address for notifications
app.mail.from=${MAIL_FROM}
# Default destination for HR reports
app.mail.hr-report=${MAIL_HR_REPORT}

# ==============================================================
# WEB PUSH NOTIFICATIONS (VAPID KEYS)
# ==============================================================
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@baglass.com
# Encryption Secret for 2FA
app.encryption.secret=${ENCRYPTION_SECRET}
