# Importación de secretos (archivo local ignorado por Git)
spring.config.import=optional:file:.env[.properties]

maven.basedir=@project.basedir@
# database init, supports mysql too
#spring.datasource.schema=classpath*:db/${database}/schema.sql
spring.mvc.pathpattern.matching-strategy=ant_path_matcher
spring.h2.console.enabled=true
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}
# Web
spring.thymeleaf.mode=HTML
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================
# OPTIMIZACIONES DE MEMORIA Y RENDIMIENTO (Low-RAM / 512MB)
# ==============================================================
# Desactivar JMX para ahorrar memoria nativa
spring.jmx.enabled=false

# Hilos Virtuales Java 21 / Spring Boot 3
spring.threads.virtual.enabled=true

# Servidor Tomcat Optimizado
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50

# Pool de Base de Datos HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# Compresión HTTP Gzip
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Caché de Recursos Estáticos del Frontend
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Caffeine Cache Configuration (TTL 10m, Max 500 entries)
spring.cache.type=caffeine
spring.cache.cache-names=companies,authorities,departments
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Internationalization
spring.messages.basename=messages/messages

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Actuator / Management
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=smart-checkin-system

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.resources.cache.cachecontrol.max-age=12h

# App Properties
spring.application.name=smart-checkin-system
smartcheckin.app.jwtSecret=${JWT_SECRET:unSecretoFalsoParaTestMuyLargo123456789}
smartcheckin.app.jwtExpirationMs=86400000 
smartcheckin.app.totpSecret=${TOTP_SECRET:secretoFalsoTotp}
smartcheckin.app.jwtCookieSecure=${JWT_COOKIE_SECURE:false}
app.cors.allowed-origins=http://localhost:3000,https://smart-checkin-system.onrender.com

# API Properties
api.version=1.0-SNAPSHOT
tos.uri=terms-of-service
api.server.url=I don't know
api.description=The API is used to ...
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Email Properties (Brevo SMTP Configuration)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:correo@ejemplo.com}
spring.mail.password=${MAIL_PASSWORD:password_falsa}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Default "From" address for notifications
app.mail.from=${MAIL_FROM:noreply@ejemplo.com}
# Default destination for HR reports
app.mail.hr-report=${MAIL_HR_REPORT:hr@ejemplo.com}

# ==============================================================
# WEB PUSH NOTIFICATIONS (VAPID KEYS)
# ==============================================================
vapid.public.key=${VAPID_PUBLIC_KEY:clavePublicaFalsa}
vapid.private.key=${VAPID_PRIVATE_KEY:clavePrivadaFalsa}
vapid.subject=mailto:admin@example.com
# Encryption Secret for 2FA
app.encryption.secret=${ENCRYPTION_SECRET:SuperSecretTestKeyFalsa1234567890}

# ==============================================================
# AZURE ONEDRIVE OAUTH2 CREDENTIALS
# ==============================================================
azure.client.id=${AZURE_CLIENT_ID:clientIdFalsoTest}
azure.client.secret=${AZURE_CLIENT_SECRET:clientSecretFalsoTest}

# ==============================================================
# URLS DE BACKEND / FRONTEND (por entorno via .env)
# ==============================================================
app.backend.url=${BACKEND_URL:http://localhost:8080}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==============================================================
# CONFIGURACIÓN DE BASE DE DATOS LOCAL / DOCKER
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:smartcheckin}
spring.datasource.username=${POSTGRES_USER:checkin_user}
spring.datasource.password=${POSTGRES_PASSWORD:ContrasenaFalsaParaSonar123!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# FLYWAY DATABASE MIGRATIONS
# ==============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ==============================================================
# CLOUDFLARE TURNSTILE (CAPTCHA)
# ==============================================================
app.captcha.site-key=${REACT_APP_CAPTCHA_SITE_KEY:${CAPTCHA_SITE_KEY:1x00000000000000000000AA}}
app.captcha.secret=${CAPTCHA_SECRET:1x0000000000000000000000000000000AA}

# ==============================================================
# EXTERNAL WEBHOOK INTEGRATIONS (Teams / Slack / Generic)
# ==============================================================
app.webhook.url=${APP_WEBHOOK_URL:}
app.webhook.teams-url=${APP_WEBHOOK_TEAMS_URL:}
app.webhook.slack-url=${APP_WEBHOOK_SLACK_URL:}