# ==============================================================
# SMART CHECKIN SYSTEM - TEST CONFIGURATION (H2 In-Memory)
# ==============================================================

# Database: H2 in-memory
spring.datasource.url=jdbc:h2:mem:smartcheckin_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:data.sql
spring.sql.init.data-locations=classpath*:data.sql

# App Security & Secrets for Testing
badistributionacademy.app.jwtSecret=unSecretoFalsoParaTestMuyLargo123456789
smartcheckin.app.jwtSecret=unSecretoFalsoParaTestMuyLargo123456789
badistributionacademy.app.jwtExpirationMs=86400000
smartcheckin.app.jwtExpirationMs=86400000
badistributionacademy.app.totpSecret=secretoFalsoTotp
smartcheckin.app.totpSecret=secretoFalsoTotp
app.encryption.secret=SuperSecretTestKeyFalsa1234567890
vapid.public.key=clavePublicaFalsa
vapid.private.key=clavePrivadaFalsa
azure.client.id=clientIdFalsoTest
azure.client.secret=clientSecretFalsoTest
app.captcha.secret=1x0000000000000000000000000000000AA

# Mail Testing
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@smartcheckin.com
spring.mail.password=test
app.mail.from=noreply@smartcheckin.com
app.mail.hr-report=hr@smartcheckin.com

# Disable banner and noise
spring.main.banner-mode=off
